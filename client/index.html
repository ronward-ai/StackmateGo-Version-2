<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale: it used to pin scale at 1, which blocks pinch-zoom on
         the one screen players squint at across a table. Locking zoom is an
         accessibility failure, and it was never load-bearing here. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>StackMate Go - Poker Tournament Timer</title>
    <meta name="description" content="Professional poker tournament management with real-time timers, player tracking, blind structures, league management, and multi-device sync. Perfect for home games and professional tournaments." />

    <!-- Icons and installability.
         There was no favicon at all, and stackmatelogo.svg sat unused in
         public/ — so every tab showed the browser's default page glyph. The
         manifest is what lets a director add the console to a tablet's home
         screen, which is how this app is actually used all evening. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="StackMate" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="StackMate Go - Poker Tournament Timer" />
    <meta property="og:description" content="Professional poker tournament management with real-time timers, player tracking, blind structures, and league management." />
    <meta property="og:site_name" content="StackMate Go" />
    <!-- The card claimed summary_large_image and supplied no image, so every
         shared link previewed blank. Absolute URLs: scrapers do not resolve
         relative ones. -->
    <meta property="og:url" content="https://stackmatego.com/" />
    <meta property="og:image" content="https://stackmatego.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="StackMate Go — poker tournament timer and league manager" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StackMate Go - Poker Tournament Timer" />
    <meta name="twitter:description" content="Professional poker tournament management with real-time timers, player tracking, and league management." />
    <meta name="twitter:image" content="https://stackmatego.com/og-image.png" />

    <!-- Additional SEO -->
    <meta name="keywords" content="poker, tournament, timer, blind structure, league, player tracking, home game, poker timer, stackmate" />
    <meta name="author" content="StackMate Go" />
    <meta name="robots" content="index, follow" />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#0d1117" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
